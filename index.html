<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <title>Dispensa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Dispensa</h1>
  </header>

  <main>
    <!-- Riquadro della fotocamera -->
    <div id="lettore" class="lettore" hidden>
      <video id="video" playsinline muted autoplay></video>
      <div class="mirino"></div>
    </div>

    <!-- Pulsanti dello zoom (compaiono solo se il telefono lo permette) -->
    <div id="zoom" class="zoom" hidden></div>

    <button id="btn-scansiona" class="grande">📷 Scansiona codice</button>
    <button id="btn-stop" class="grande secondario" hidden>Annulla</button>

    <p id="messaggio" class="messaggio"></p>

    <section id="risultato" hidden>
      <p class="etichetta">Codice letto</p>
      <p id="codice" class="codice"></p>
    </section>

    <section>
      <p class="etichetta">Ultime letture</p>
      <ul id="storico-letture" class="lista"></ul>
    </section>

    <details class="opzioni">
      <summary>Opzioni fotocamera</summary>
      <label for="scelta-camera">Fotocamera da usare</label>
      <select id="scelta-camera">
        <option value="">Automatica (posteriore)</option>
      </select>
      <p class="nota">L'elenco si riempie dopo la prima scansione. Se una fotocamera non mette a fuoco da vicino, provane un'altra.</p>
      <p id="diagnosi" class="nota"></p>
    </details>
  </main>

  <!-- Lettore di codici a barre gratuito (zxing-wasm, licenza MIT) -->
  <script src="lib/zxing-reader.js"></script>
  <script src="app.js"></script>
</body>
</html>
